# General Settings
general {
        colors = true
        interval = 5
}

# Elements
order += "ethernet _first_"
order += "disk /"
order += "memory"
order += "tztime local"

ethernet _first_ {
        format_up = "IP: %ip"
        format_down = "E: down"
}

disk "/" {
        format = "%avail"
}

memory {
        format = "%used | %available"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}
